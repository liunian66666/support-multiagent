# 智能客服统一入口：静态前端 + API/WS 反代

# access log 脱敏：过滤 URL 中的凭证参数（customer_secret/app_secret），防止密钥
# 落入访问日志。与前端 history.replaceState 抹敏（登录成功即从地址栏/历史移除）
# 构成双保险；生产接入应改 SDK 模式（宿主后端签发 token，URL 不带任何凭证）。
# 实现方式：map 处理整个 $request（"METHOD uri HTTP/x"）；log_format 用独立名称 +
# access_log 定义在 server 级（nginx 规则：当前级定义即不继承上级 access_log，
# 避免与主配置的 access_log main 双写），本部署唯一 server，日志单路且脱敏。
map $request $logged_request {
    ~^(?<pre>.*)[?&](customer_secret|app_secret|token)=[^&]*(?<post>.*)$ "${pre}[REDACTED]${post}";
    default $request;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$logged_request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    # 脱敏访问日志（覆盖主配置 http 级 access_log main，单路输出）
    access_log /var/log/nginx/access.log redacted;

    # 透传带下划线的自定义 header（X-Internal-Token 等）：nginx 默认
    # underscores_in_headers off 会静默丢弃此类 header，导致服务间令牌校验失败
    underscores_in_headers on;

    # 知识库文件上传：放行到 110MB（业务层 kb_max_file_mb 上限 100MB + multipart 开销），
    # 精确限制由 agent 业务层按平台配置动态校验
    client_max_body_size 110m;

    # 使用 Docker 内置 DNS 服务器，避免 upstream IP 缓存
    # 当容器重启导致 IP 变化时，Nginx 能自动重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 管理后台（Vue3 单页应用，构建产物在 web/admin/dist）
    location /admin/ {
        alias /usr/share/nginx/html/web/admin/dist/;
        index index.html;
        # hash 路由无需 rewrite；兜底到 index.html 防刷新 404
        try_files $uri $uri/ /admin/index.html;
        # 前端 JS/HTML 更新频繁：no-cache 确保浏览器每次 revalidate，避免旧 JS 混合引用
        add_header Cache-Control "no-cache";
    }

    # 旧版商家预览链接可能带管理密钥，静态页面请求不记录 URL。
    location = /chat/pc.html {
        alias /usr/share/nginx/html/web/chat/pc.html;
        access_log off;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    # H5 全屏客服页同理：URL 可能带演示凭证，同样不记录/不Referer/不缓存
    location = /chat/h5.html {
        alias /usr/share/nginx/html/web/chat/h5.html;
        access_log off;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /chat/login.html {
        alias /usr/share/nginx/html/web/chat/login.html;
        access_log off;
        add_header Cache-Control "no-store";
        add_header Referrer-Policy "no-referrer" always;
    }

    # 聊天内核（PC + H5）
    location /chat/ {
        alias /usr/share/nginx/html/web/chat/;
        index index.html;
        try_files $uri $uri/ =404;
        # 聊天内核更新频繁：no-cache 确保浏览器每次 revalidate，避免旧 HTML/JS 缓存导致新版登录流程不生效
        add_header Cache-Control "no-cache";
    }

    # SDK 接入脚本 + 多端接入示例（第三方网站引入）
    location /sdk/ {
        alias /usr/share/nginx/html/web/sdk/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }
    # 知识库原文件（共享卷挂载，上传时由 agent 落盘，此处直接静态服务）
    # 安全性：路径含随机 doc_id + 租户前缀，外部无法枚举；如需更强鉴权可换签名 URL/对象存储
    # charset utf-8：让 txt/md 预览按 UTF-8 渲染（避免中文乱码），pdf 等二进制不受影响
    location /kb_files/ {
        alias /usr/share/nginx/html/kb_files/;
        add_header Cache-Control "public, max-age=86400";
        charset utf-8;
    }
    # 会话图片（business 写入 /app/msg_files，nginx 同卷静态服务）
    location /msg_files/ {
        alias /usr/share/nginx/html/msg_files/;
        add_header Cache-Control "public, max-age=86400";
    }

    # P1-5：SDK 版本化 URL（/sdk/cs-chat@x.y.z.js 始终指向当前版本文件）
    # 升级 SDK 时第三方无需改 URL，只需更新版本号参数即可强制刷新浏览器缓存
    location ~ ^/sdk/cs-chat@[0-9]+\.[0-9]+\.[0-9]+\.js$ {
        alias /usr/share/nginx/html/web/sdk/cs-chat.js;
        add_header Cache-Control "public, max-age=86400";
    }

    # 根路径进入用户聊天登录页；使用临时重定向，避免浏览器长期缓存入口选择
    location = / {
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        return 302 /chat/login.html;
    }

    # FastAPI 业务层并行验收入口；内部 Agent 适配接口不能从公网访问。
    location ^~ /py-api/api/agent/ {
        return 404;
    }
    location /py-api/ {
        set $business_backend "http://business:8001";
        rewrite ^/py-api/(.*)$ /$1 break;
        proxy_pass $business_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 浏览器 WebSocket 握手需携带短期客户令牌；不把 query token 写入访问日志。
    location = /ws/chat {
        access_log off;
        set $business_backend "http://business:8001";
        proxy_pass $business_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location = /ws/admin {
        access_log off;
        set $business_backend "http://business:8001";
        proxy_pass $business_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # 内部 Agent 接口只能通过容器网络访问。
    location ^~ /api/agent/ {
        return 404;
    }

    # 客户、商家、认证 API 均切至 Python 业务层。
    location /api/ {
        set $business_backend "http://business:8001";
        proxy_pass $business_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        set $business_backend "http://business:8001";
        proxy_pass $business_backend;
    }

    location = /metrics {
        set $business_backend "http://business:8001";
        proxy_pass $business_backend;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
