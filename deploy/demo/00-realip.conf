# 公开演示站专用：把宿主机 HTTPS 反代传入的真实访客 IP 还原为 $remote_addr。
#
# 为什么必须：deploy/nginx.conf 里是 proxy_set_header X-Real-IP $remote_addr，
# 业务层的登录限流（business/customer/routes.py::allow_login）与 WebSocket
# （business/chat/realtime.py）都只读 X-Real-IP。若外层再套一层反代而不做
# 真实 IP 透传，所有访客在业务层看来都是 127.0.0.1，会共用 Redis 限流键
# cs:biz:login:minute:* —— 5 次失败即把全部访客锁 10 分钟，且无法按 IP 封禁。
#
# 生效方式：由 docker-compose.demo.yaml 挂载到
# /etc/nginx/conf.d/00-realip.conf。运行镜像是 nginx:alpine，其主配置在 http
# 块 include /etc/nginx/conf.d/*.conf，因此无需修改 deploy/nginx.conf。
# set_real_ip_from / real_ip_header 允许写在 http 上下文。
#
# 安全前提：只有「SM_nginx 仅监听 127.0.0.1、且外层反代用 $remote_addr 覆盖
# X-Forwarded-For」时才可信。若 8080 直接对公网开放，本文件会让访客能伪造
# 来源 IP，必须停用。

set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
