# Python business + Agent + Vue/Nginx build pipeline.
# Deployment is performed with docker-compose.yaml on the target host.
stages:
  - test
  - docker_build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"

business_tests:
  stage: test
  image: python:3.13-slim
  script:
    - cd python_business
    - pip install -r requirements.txt
    - python -m compileall -q .
    - python -m unittest discover -s tests -q

agent_tests:
  stage: test
  image: python:3.13-slim
  script:
    - cd python_agent
    - pip install -r requirements.txt
    - python -m compileall -q app
    - python -m unittest discover -s tests -q

frontend_build:
  stage: test
  image: node:20-alpine
  script:
    - cd admin-app
    - npm ci --no-audit --no-fund
    - npm run build

build_business_image:
  stage: docker_build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/cs-business:$CI_COMMIT_SHORT_SHA" ./python_business
    - docker push "$CI_REGISTRY_IMAGE/cs-business:$CI_COMMIT_SHORT_SHA"

build_agent_image:
  stage: docker_build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/cs-agent:$CI_COMMIT_SHORT_SHA" ./python_agent
    - docker push "$CI_REGISTRY_IMAGE/cs-agent:$CI_COMMIT_SHORT_SHA"

build_nginx_image:
  stage: docker_build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f nginx.Dockerfile -t "$CI_REGISTRY_IMAGE/cs-nginx:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/cs-nginx:$CI_COMMIT_SHORT_SHA"
