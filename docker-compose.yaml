# ============================================================================
# 智能客服系统 - 生产环境一键部署
# 用法：
#   1. 复制 .env.example 为 .env，修改配置
#   2. docker compose up -d
#   3. 访问 http://localhost:8080
#
# 说明：
#   - 所有镜像从镜像仓库拉取，无需本地构建
#   - 数据持久化到命名卷，删除容器不丢失数据
#   - 可观测性服务（Prometheus/Grafana/Loki/Jaeger）默认不启动
#     如需启动：docker compose --profile observability up -d
# ============================================================================

name: cs-customer-service

services:
  # ==========================================================================
  # 基础服务：Redis + MySQL + PostgreSQL + Qdrant
  # ==========================================================================
  
  # Redis（强制依赖：登录限流 / Token 黑名单 / 模型配置缓存失效广播 / 定时任务锁）
  # 说明：AOF 持久化 + LRU 256MB；数据在 cs_redis_data 卷内。
  #       生产建议使用云 Redis（高可用）或主从+Sentinel 替代本单实例，避免单点故障
  redis:
    image: redis:7-alpine
    container_name: cs_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - cs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cs-network
  mysql:
    image: mysql:8.4
    container_name: cs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cs_biz_db}
      TZ: Asia/Shanghai
    volumes:
      - cs_mysql_data:/var/lib/mysql
      - ./deploy/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    networks:
      - cs-network
    ports:
      - "3306:3306"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-cs_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-cs_user}
      TZ: Asia/Shanghai
    volumes:
      - cs_postgres_data:/var/lib/postgresql/data
      - ./deploy/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs_user} -d ${POSTGRES_DB:-cs_agent_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cs-network
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cs_qdrant
    restart: unless-stopped
    volumes:
      - cs_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - cs-network

  # FastAPI 业务层：客户身份、会话、只读订单、工单和实时聊天。
  business:
    build: ./python_business
    container_name: cs_business
    restart: unless-stopped
    environment:
      # 统计类接口按「今天」划分日期边界，
      # 容器默认 UTC 会让 last7days 在 CST 00:00-08:00 区间差一天
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cs_biz_db}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cs_internal_token_2026_secure}
      TENANT_T_ADMIN_SECRET: ${TENANT_T_ADMIN_SECRET:?TENANT_T_ADMIN_SECRET 未配置}
      TENANT_T_DEMO_SECRET: ${TENANT_T_DEMO_SECRET:?TENANT_T_DEMO_SECRET 未配置}
      CS_AGENT_URL: "http://agent:8000"
      # 阶段 3-4 起：本层也读写 tenants.model_api_key / embedding_api_key，
      # 必须与 go 用同一把 AES-GCM 密钥，否则彼此解不开对方的密文
      MODEL_KEY_ENCRYPT_KEY: ${MODEL_KEY_ENCRYPT_KEY:?MODEL_KEY_ENCRYPT_KEY 未配置}
      CS_AUTH_DEMO_CUSTOMER_LOGIN: "${CS_AUTH_DEMO_CUSTOMER_LOGIN:-true}"
      CS_AUTH_DEMO_GUEST_CHAT: "${CS_AUTH_DEMO_GUEST_CHAT:-true}"
      CS_AUTH_DEMO_GUEST_TENANT_ID: "${CS_AUTH_DEMO_GUEST_TENANT_ID:-t_demo}"
      CS_AUTH_MERCHANT_PREVIEW_LOGIN: "${CS_AUTH_MERCHANT_PREVIEW_LOGIN:-true}"
      DEMO_CUSTOMER_APP_KEY: demo_buyer_key
      DEMO_CUSTOMER_TENANT_ID: t_demo
      DEMO_CUSTOMER_ALLOWED: buyer1,buyer2
      DEMO_CUSTOMER_DEMO_BUYER_KEY_SECRET: ${DEMO_CUSTOMER_DEMO_BUYER_KEY_SECRET:-demo_buyer_secret}
    volumes:
      # 会话图片/视频由 business 写入，nginx 静态服务 /msg_files/。
      - cs_msg_files:/app/msg_files
      # 持久化 RSA 私钥，重启后已缓存的登录公钥仍可用。
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - cs-network

  business-maintenance:
    build: ./python_business
    container_name: cs_business_maintenance
    restart: unless-stopped
    command: ["python", "maintenance.py"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cs_biz_db}
      REDIS_URL: redis://redis:6379/0
      MSG_RETENTION_DAYS: ${MSG_RETENTION_DAYS:-90}
      # [ours] S2 反馈 Outbox→agent 经验层同步
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cs_internal_token_2026_secure}
      CS_AGENT_URL: http://agent:8000
      OUTBOX_SYNC_INTERVAL: ${OUTBOX_SYNC_INTERVAL:-60}
    depends_on:
      business:
        condition: service_healthy
    networks:
      - cs-network

  # ==========================================================================
  # 业务服务：Agent + Python FastAPI + Nginx
  # ==========================================================================
  agent:
    build: ./python_agent
    container_name: cs_agent
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      # 知识库原文件共享卷（agent 写入，nginx 静态服务下载/预览）
      - cs_kb_files:/app/data/kb_files
    environment:
      # PROD_MODE: "true"
      SESSION_RETENTION_DAYS: "7"
      SESSION_CLEANUP_INTERVAL: "21600"
      # 会话自动摘要后台任务：间隔秒数（默认 600s=10 分钟一轮）
      SESSION_SUMMARY_INTERVAL: "600"
      # [ours] S3 经验层：召回开关 off|shadow|inject（缺省 off=完全关闭）。
      # 影子期切 shadow：召回只记 experience_hit 事件、不改任何应答（注入路径零流量）
      EXPERIENCE_DISTILL_INTERVAL: "60"   # 对比评测试运行期高频提炼（生产缺省 1800，0=禁用）
      EXPERIENCE_DISTILL_MAX_PER_ROUND: "10"
      # EXPERIENCE_RECALL_MODE: "shadow"
      # [ours] S6 治理：LLM SDK 层重试（429/5xx/超时指数退避）；0=关闭保持旧行为
      LLM_MAX_RETRIES: "2"
      # [ours] S6 治理可选项（注释=保持旧行为，按需开启）：
      # AGENT_RECURSION_LIMIT: "12"     # 图步数预算（缺省 0=沿用 LangGraph 默认 25）
      # CHECKPOINT_PING_TTL: "5"        # checkpoint 探活降频秒数（缺省 0=每操作探测）
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-cs_internal_token_2026_secure}
      # 容器内使用服务名连接（覆盖 .env 中宿主机视角的 127.0.0.1 配置）
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-cs_user}:${POSTGRES_PASSWORD:-cs_pass123}@postgres:5432/${POSTGRES_DB:-cs_agent_db}
      QDRANT_URL: http://qdrant:6333
      # Qdrant 配置
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      # Agent 内部配置、配额、摘要及订单均由 Python 业务层提供。
      BUSINESS_API: http://business:8001
      ORDER_BUSINESS_API: http://business:8001
      # Redis（强制依赖）：缓存失效广播订阅 / 定时任务锁
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      business:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - cs-network

  nginx:
    # 多阶段构建：容器内编译 admin-app 前端 + 打包 web/ 静态资源，
    # 无需在宿主机预先执行 scripts/build_admin_app.sh（见 nginx.Dockerfile）
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: cs_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # nginx.conf 保留挂载：改配置后 docker exec cs_nginx nginx -s reload 即时生效
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 知识库原文件共享卷（与 agent 同一卷，静态服务 /kb_files/）
      - cs_kb_files:/usr/share/nginx/html/kb_files
      # 会话图片共享卷（business 写入，静态服务 /msg_files/）
      - cs_msg_files:/usr/share/nginx/html/msg_files
    depends_on:
      - business
    networks:
      - cs-network

  # ==========================================================================
  # P0-5：定时备份服务（每日备份 MySQL/PG/Qdrant + 保留 N 天）
  # 备份目录 ./backups 建议挂载到宿主机目录或 NAS；日志见 ./backups/backup.log
  # 默认每日 02:30 执行，可用 BACKUP_CRON 覆盖；BACKUP_RETENTION_DAYS 控制保留天数
  # ==========================================================================
  # backup:
  #   image: alpine:3.20
  #   container_name: cs_backup
  #   restart: unless-stopped
  #   environment:
  #     BACKUP_CONTAINER_MODE: "1"
  #     BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
  #     BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
  #     MYSQL_HOST: mysql
  #     MYSQL_USER: root
  #     MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-cs_biz_db}
  #     PG_HOST: postgres
  #     PG_USER: ${POSTGRES_USER:-cs_user}
  #     PG_PASSWORD: ${POSTGRES_PASSWORD:-cs_pass123}
  #     PG_DATABASE: ${POSTGRES_DB:-cs_agent_db}
  #     QDRANT_HOST: qdrant
  #     QDRANT_PORT: "6333"
  #   volumes:
  #     - ./backup:/backup:ro
  #     - ./backups:/backups
  #   command: ["/bin/sh", "/backup/entrypoint.sh"]
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_healthy
  #   networks:
  #     - cs-network

  # ==========================================================================
  # 可观测性服务（可选，通过 profile 启动）
  # 启动方式：docker compose --profile observability up -d
  # ==========================================================================
  # ============ P3-1 统一日志收集：Loki + Promtail ============
  loki:
    image: grafana/loki:3.0.0
    container_name: cs_loki
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - cs_loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cs-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: cs_promtail
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./deploy/observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - cs-network   

  # ============ P3-2 监控告警：Prometheus + Grafana ============
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: cs_prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - cs_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - business
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: cs_grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/customer-service-overview.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cs_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  # ============ P3-3 链路追踪：Jaeger ============
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: cs_jaeger
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_PORT: "4318"
      SPAN_STORAGE_TYPE: "memory"
      MEMORY_MAX_TRACES: "10000"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4318:4318"    # OTLP HTTP
      - "4317:4317"    # OTLP gRPC
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

# ==========================================================================
# 数据卷（持久化存储）
# ==========================================================================
volumes:
  cs_mysql_data:
  cs_redis_data:
  cs_postgres_data:
  cs_qdrant_data:
  cs_loki_data:
  cs_prometheus_data:
  cs_grafana_data:
  # 知识库原文件共享卷（agent 写入 /app/data/kb_files，nginx 静态服务 /kb_files/）
  cs_kb_files:
  # 会话图片共享卷（business 写入 /app/msg_files，nginx 静态服务 /msg_files/）
  cs_msg_files:

# ==========================================================================
# 网络
# ==========================================================================
networks:
  cs-network:
    driver: bridge
