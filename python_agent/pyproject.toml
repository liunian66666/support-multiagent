# Ruff 配置
# 运行：ruff check .

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (由 line-length 控制)
    "B008",  # function call in default argument
    "UP006", # use `list` instead of `List` (Python 3.9+)
    "UP007", # use `X | Y` instead of `Union` (Python 3.10+)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"main.py" = ["B008", "E402"]
"app/server.py" = ["E402"]   # 日志必须先于其余模块装配，import 位于 setup 调用之后
"backups/*" = ["ALL"]
"assets/examples/*" = ["ALL"]
"assets/examples/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# tests/ 无 __init__.py 时 pytest 会把 tests/ 而非项目根放进 sys.path，
# 必须显式声明根目录，否则 `import app` 失败。
pythonpath = ["."]
testpaths = ["tests"]
