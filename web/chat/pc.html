<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线客服</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
html,body{height:100%;width:100%;overflow:hidden;background:#f5f6f8}

/* 整体容器 */
.app-shell{display:flex;height:100vh;width:100%;overflow:hidden}
.chat-container{display:flex;flex-direction:column;height:100vh;flex:1;min-width:0;background:#fff}

/* 顶部栏 */
.chat-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 18px;
  background:linear-gradient(135deg,var(--theme,#1890ff),var(--theme-dark,#096dd9));
  color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.chat-header .avatar{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.chat-header .info{flex:1;min-width:0}
.chat-header .title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header .status{font-size:12px;opacity:.9;display:flex;align-items:center;gap:5px;margin-top:2px}
.chat-header .status .dot{width:7px;height:7px;border-radius:50%;background:#52c41a;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-header .actions{display:flex;gap:6px}
.chat-header .actions button{
  background:rgba(255,255,255,.15);border:none;color:#fff;
  width:32px;height:32px;border-radius:6px;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.chat-header .actions button:hover{background:rgba(255,255,255,.3)}

/* 消息区 */
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#f5f6f8}
.chat-body::-webkit-scrollbar{width:6px}
.chat-body::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* 消息气泡 */
.msg{display:flex;gap:8px;max-width:min(680px,86%);animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.ai{align-self:flex-start}
.msg.ai>div:not(.msg-avatar){min-width:0}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .bubble{
  padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.72;
  word-break:break-word;white-space:normal;position:relative;
}
.msg.ai .bubble{background:#fff;border:1px solid #e8e8e8;border-top-left-radius:4px;color:#333}
.msg.user .bubble{background:var(--theme,#1890ff);color:#fff;border-top-right-radius:4px;
  white-space:pre-wrap}
/* Markdown 渲染后的排版：块间距统一交给 margin，不再依赖 pre-wrap 的换行 */
.bubble p{margin:0 0 8px}
.bubble p:last-child,.bubble ul:last-child,.bubble ol:last-child,
.bubble pre:last-child,.bubble .md-kv:last-child,.bubble .md-table-wrap:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:0 0 8px;padding-left:20px}
.bubble li{margin:2px 0}
.bubble strong{font-weight:500}
.bubble em{font-style:normal;color:#5f6672}
.bubble a{color:#1890ff;text-decoration:none}
.bubble a:hover{text-decoration:underline}
.bubble code{background:#f2f4f7;border-radius:4px;padding:1px 5px;
  font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.bubble pre{margin:0 0 8px;padding:10px 12px;background:#f7f8fa;
  border:1px solid #e8eaee;border-radius:8px;overflow:auto}
.bubble pre code{background:none;padding:0;display:block;white-space:pre;font-size:12.5px;line-height:1.6}
.bubble blockquote{margin:0 0 8px;padding:2px 0 2px 10px;border-left:2px solid #e2e6ec;color:#5f6672}
.md-h1,.md-h2,.md-h3{font-weight:500;margin:0 0 8px;color:#1f2329}
.md-h1{font-size:16px}
.md-h2{font-size:15px}
.md-h3{font-size:14px}
.md-hr{height:1px;background:#eceef2;margin:10px 0}
/* 订单信息这类「标签：值」列表转成两列，扫读时不用逐行找冒号 */
.md-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:2px 0 10px}
.md-kv-k{color:#8a8f99;white-space:nowrap}
.md-kv-v{min-width:0}
.md-table-wrap{max-width:100%;overflow-x:auto;margin:2px 0 10px}
.md-table-wrap table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
.md-table-wrap th,.md-table-wrap td{padding:7px 10px;border:1px solid #e8eaee;text-align:left;white-space:nowrap}
.md-table-wrap th{background:#f7f8fa;font-weight:500}
/* 订单记录行：桌面宽度够，四列一行对齐 */
.bubble ul.md-rows{list-style:none;padding-left:0;margin:2px 0 10px}
.md-row{padding:7px 0}
.md-row+.md-row{border-top:1px solid #f2f4f7}
.md-row-record{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content max-content;
  gap:0 18px;align-items:center}
.md-row-record .md-key{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;color:#1f2329;letter-spacing:.2px;white-space:nowrap}
.md-row-record .md-main{font-size:13.5px;color:#333;overflow-wrap:anywhere}
.md-row-record .md-state{justify-self:start}
.md-row-record .md-meta{font-size:12.5px;color:#98a0ab;white-space:nowrap}
.md-chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:12px;
  line-height:1.6;white-space:nowrap}
.md-chip-ship{background:#eaf2fd;color:#1a62c9}
.md-chip-wait{background:#fdf3e4;color:#a4610c}
.md-chip-done{background:#eaf6ee;color:#2a7a45}
.md-chip-after{background:#f3eefb;color:#5b45a8}
.md-chip-void{background:#f2f4f7;color:#7a828d}

.msg .time{font-size:11px;color:#6b7280;margin-top:5px}
.msg.ai .time{text-align:left}
.msg.user .time{text-align:right}

/* 消息头像：与侧栏品牌图标同一视觉语言，取代原来的裸 emoji */
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;
  border:1px solid transparent}
.msg-avatar.ai{background:#fff;border-color:#e8eaee}
.msg-avatar.human{background:#fff7e6;border-color:#ffe0b2;color:#d46b08}
/* 机器人用 emoji，但必须锁死字号：24px 的裸 emoji 比气泡正文还大，是原来最抢眼的失谐元素 */
.msg-avatar .emoji{font-size:16px;line-height:1}

/* 系统消息 */
.msg.system{align-self:center;max-width:90%}
.msg.system .bubble{
  background:#fff7e6;border:1px solid #ffe7ba;color:#d46b08;
  font-size:12px;padding:6px 14px;border-radius:16px;text-align:center;
}

/* 打字指示器 */
.typing{align-self:flex-start;display:flex;gap:8px;align-items:center}
.typing .bubble{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:12px 16px;display:flex;gap:4px}
.typing .dot{width:7px;height:7px;border-radius:50%;background:#bbb;animation:typing 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* 输入区 */
.chat-input{
  display:flex;flex-direction:column;gap:8px;
  padding:12px 16px;background:#fff;border-top:1px solid #e8e8e8;flex-shrink:0;
}
.chat-input .toolbar{display:flex;align-items:center;gap:8px}
.chat-input .toolbar button{
  background:none;border:1px solid #e8e8e8;color:#666;
  padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;
  transition:all .2s;
}
.chat-input .toolbar button:hover{border-color:var(--theme,#1890ff);color:var(--theme,#1890ff)}
.chat-input .toolbar .handoff{color:#fa8c16;border-color:#fa8c16}
.chat-input .toolbar .handoff:hover{background:#fff7e6}
.chat-input .toolbar .rating-btn{color:#722ed1;border-color:#722ed1}
.chat-input .toolbar .rating-btn:hover{background:#f9f0ff}
.rating-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center}
.rating-modal{width:320px;max-width:90vw;background:#fff;border-radius:12px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.rating-title{font-size:15px;font-weight:600;color:#1f1f1f;margin-bottom:14px;text-align:center}
.rating-stars{display:flex;justify-content:center;gap:6px;font-size:32px;margin-bottom:12px}
.rating-stars .star{color:#e5e5e5;cursor:pointer;transition:color .15s;user-select:none}
.rating-stars .star.on{color:#f5a623}
.rating-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rating-tags .tag{padding:4px 10px;border:1px solid #d9d9d9;border-radius:14px;font-size:12px;color:#555;background:#fff;cursor:pointer}
.rating-tags .tag.on{border-color:#722ed1;color:#722ed1;background:#f9f0ff}
.rating-comment{width:100%;box-sizing:border-box;border:1px solid #d9d9d9;border-radius:8px;padding:8px 10px;font-size:13px;resize:vertical;min-height:56px}
.rating-actions{display:flex;gap:10px;margin-top:14px}
.rating-actions button{flex:1;padding:8px 0;border-radius:8px;font-size:13px;cursor:pointer}
.rating-cancel{border:1px solid #d9d9d9;background:#fff;color:#666}
.rating-submit{border:none;background:var(--theme,#1890ff);color:#fff}
.rating-submit:disabled{background:#ccc;cursor:not-allowed}
.chat-input .input-row{display:flex;gap:10px;align-items:flex-end}
.chat-input{position:relative}
.chat-input .media-btn{
  display:flex;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;
  padding:10px 12px;border:1px solid #e8e8e8;border-radius:8px;background:#fff;
  font-size:13px;color:#555;transition:all .2s;white-space:nowrap;
}
.chat-input .media-btn:hover{border-color:#1890ff;color:#1890ff;background:#f4f9ff}
.chat-input .media-btn:active{background:#eaf4ff}
.chat-input .drop-tip{
  position:absolute;left:8px;right:8px;top:44px;z-index:50;
  background:rgba(24,144,255,.08);border:1.5px dashed #1890ff;border-radius:8px;
  color:#1890ff;font-size:13px;text-align:center;padding:10px 0;
  pointer-events:none;opacity:0;transition:opacity .15s;
}
.chat-input .drop-tip.show{opacity:1}
.chat-input textarea{
  flex:1;border:1px solid #e8e8e8;border-radius:8px;padding:10px 12px;
  font-size:14px;resize:none;outline:none;line-height:1.5;
  font-family:inherit;max-height:100px;min-height:40px;
  transition:border-color .2s;
}
.chat-input textarea:focus{border-color:var(--theme,#1890ff)}
.chat-input .send-btn{
  background:var(--theme,#1890ff);color:#fff;border:none;
  padding:10px 22px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
  transition:background .2s;flex-shrink:0;height:40px;
}
.chat-input .send-btn:hover{background:var(--theme-dark,#096dd9)}
.chat-input .send-btn:disabled{background:#ccc;cursor:not-allowed}
.chat-input .hint{font-size:11px;color:#999}

/* 欢迎语 */
.welcome{align-self:center;margin:auto;text-align:center;padding:20px 0;color:#999}
.welcome .icon{font-size:40px;margin-bottom:8px}
.welcome .text{font-size:13px;line-height:1.8}
.welcome-resume{margin-top:16px;max-width:340px;padding:9px 16px;border:1px solid #e2e6ec;border-radius:9px;background:#fff;font-size:12px;color:#4a5160;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s,border-color .15s}
.welcome-resume:hover{background:#f5f7fa;border-color:#cfd6df}
.welcome-resume[hidden]{display:none}

/* 连接状态提示 */
.conn-status{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;
  font-size:12px;z-index:100;display:none;
}

/* ============ 会话侧栏 ============ */
.conv-sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column;
  background:#f7f8fa;border-right:1px solid #e8eaee;transition:width .18s ease;overflow:hidden}
.conv-sidebar.collapsed{width:0;border-right:none}
.conv-head{display:flex;align-items:center;gap:8px;padding:13px 10px 10px;flex-shrink:0}
.conv-brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.conv-brand-icon{width:26px;height:26px;border-radius:7px;background:var(--theme,#1890ff);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv-brand-text{min-width:0}
.conv-brand-title{font-size:13px;font-weight:600;color:#1f2329;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-brand-sub{font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-new{width:28px;height:28px;flex-shrink:0;border:1px solid transparent;background:var(--theme,#1890ff);color:#fff;
  border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.conv-new:hover{opacity:.88}
.conv-search{display:flex;align-items:center;gap:6px;margin:0 10px 8px;padding:6px 9px;
  background:#fff;border:1px solid #e2e6ec;border-radius:7px;color:#6b7280;flex-shrink:0}
.conv-search:focus-within{border-color:var(--theme,#1890ff)}
.conv-search input{flex:1;min-width:0;border:none;outline:none;background:transparent;
  font-size:12px;color:#1f2329;font-family:inherit}
.conv-list{flex:1;overflow-y:auto;padding:0 6px 6px}
.conv-list::-webkit-scrollbar{width:5px}
.conv-list::-webkit-scrollbar-thumb{background:#dcdfe4;border-radius:3px}
.conv-group{position:sticky;top:0;z-index:2;background:#f7f8fa;
  font-size:11px;font-weight:500;color:#6b7280;padding:12px 8px 5px;letter-spacing:.02em}
.conv-item{display:flex;align-items:center;gap:6px;padding:7px 42px 7px 5px;border-radius:7px;
  cursor:pointer;border-left:3px solid transparent;position:relative}
.conv-item:hover{background:#eef1f5}
.conv-item.active{background:#e6f1fb;border-left-color:var(--theme,#1890ff)}
.conv-item-title{flex:1;min-width:0;font-size:12.5px;color:#1f2329;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item.active .conv-item-title{font-weight:500}
.conv-item-time{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  min-width:34px;text-align:right;font-size:10.5px;color:#8a8f99;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.conv-item-dot{position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:50%;background:var(--theme,#1890ff)}
.conv-item-more{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;border:none;background:transparent;color:#8b929c;
  border-radius:4px;cursor:pointer;opacity:0;pointer-events:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-family:inherit}
.conv-item:hover .conv-item-more{opacity:1;pointer-events:auto}
.conv-item:hover .conv-item-time,.conv-item:hover .conv-item-dot{opacity:0}
.conv-item-more:hover{background:#dfe3e8}
.conv-menu{position:absolute;right:4px;top:calc(100% - 2px);z-index:20;background:#fff;
  border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:4px;min-width:100px}
.conv-menu button{display:block;width:100%;text-align:left;padding:6px 10px;font-size:12px;
  border:none;background:none;cursor:pointer;border-radius:5px;color:#1f2329;font-family:inherit}
.conv-menu button:hover{background:#f2f4f7}
.conv-menu button.danger{color:#e5484d}
.conv-rename{flex:1;min-width:0;font-size:12.5px;padding:2px 6px;border:1px solid var(--theme,#1890ff);
  border-radius:5px;outline:none;font-family:inherit;color:#1f2329}
.conv-confirm{margin:4px 2px 8px;padding:8px 10px;border:1px solid #f7c1c1;background:#fdf3f3;border-radius:7px}
.conv-confirm-text{font-size:11.5px;color:#1f2329;line-height:1.5}
.conv-confirm-hint{font-size:10.5px;color:#9aa0a6;margin-top:2px}
.conv-confirm-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
.conv-confirm-actions button{font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;font-family:inherit;
  border:1px solid #dfe3e8;background:#fff;color:#5f6672}
.conv-confirm-actions button.danger{border-color:#f0b4b6;color:#e5484d}
.conv-empty{padding:18px 10px;text-align:center;font-size:11.5px;color:#9aa0a6;line-height:1.6}
.conv-foot{flex-shrink:0;border-top:1px solid #eceef2;padding:7px 10px;display:flex;
  align-items:center;justify-content:space-between;font-size:10.5px;color:#9aa0a6}
.conv-collapse{width:28px;height:28px;flex-shrink:0;border:1px solid #dfe3e8;background:#fff;color:#5f6672;
  border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.conv-collapse:hover{border-color:#cfd6df;color:#1f2329}
.conv-expand{position:fixed;left:12px;top:12px;z-index:60;width:30px;height:30px;border-radius:8px;
  background:#fff;border:1px solid #e5e7eb;color:#5f6672;display:none;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.conv-expand.show{display:flex}
.chat-container.sidebar-collapsed .chat-header{padding-left:52px}
@media (max-width:820px){
  .conv-sidebar{display:none}
  .conv-expand.show{display:flex}
  .chat-container.sidebar-collapsed .chat-header{padding-left:52px}
}
</style>
</head>
<body>
<div class="app-shell" id="appShell">
<aside class="conv-sidebar" id="convSidebar">
  <div class="conv-head">
    <div class="conv-brand">
      <div class="conv-brand-icon">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div class="conv-brand-text">
        <div class="conv-brand-title" id="convBrandTitle">智能客服</div>
        <div class="conv-brand-sub" id="convBrandSub">未登录</div>
      </div>
    </div>
    <button type="button" class="conv-new" id="convNewBtn" title="开始新对话">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="conv-collapse" id="convCollapseBtn" title="收起侧栏">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="conv-search" id="convSearchWrap">
    <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="text" id="convSearchInput" placeholder="搜索会话" autocomplete="off">
  </div>
  <div class="conv-list" id="convList"></div>
  <div class="conv-foot">
    <span id="convFootHint">会话保留 7 天</span>
  </div>
</aside>
<button type="button" class="conv-expand" id="convExpandBtn" title="展开会话列表">
  <svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M1.5 3h9M1.5 6h9M1.5 9h9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
</button>
<div class="chat-container" id="chatApp">
  <!-- 顶部栏 -->
  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <div class="title" id="chatTitle">智能客服</div>
      <div class="status"><span class="dot"></span><span id="chatStatus">在线</span></div>
    </div>
    <div class="actions"><button id="customerLoginButton" type="button" title="登录后可查询个人订单" style="width:auto;padding:0 10px;font-size:12px;display:none" onclick="openCustomerLogin()">登录查订单</button></div>
  </div>

  <!-- 连接状态 -->
  <div class="conn-status" id="connStatus">连接中...</div>

  <!-- 消息区 -->
  <div class="chat-body" id="chatBody">
    <div class="welcome" id="welcomeMsg">
      <div class="icon">💬</div>

<script>
// ============ 配置解析 ============
function qp(name){
  var m = location.search.match(new RegExp('[?&]'+name+'=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}

var CONFIG = {
  server: qp('server') || (location.protocol + '//' + location.host),
  // 阶段1：客户身份与会话由 FastAPI 业务层签发/校验；不可用时回退 Go 旧入口
  // （两端令牌格式一致，会话同表，因此回退不会产生两套身份）
  authBase: '/py-api',
  // 宿主/SDK 直接签发 token 传入时使用（生产接入路径）
  token: qp('token'),
  // 旧版商家测试链接：管理密钥只用于换取受限预览会话。
  app_key: qp('app_key'),
  app_secret: qp('app_secret'),
  // 演示客户凭证（仅演示模式）：与管理端 app_secret 完全分离，
  // 泄露不影响管理端；只能选择白名单内的虚构客户
  customer_key: qp('customer_key'),
  customer_secret: qp('customer_secret'),
  // 演示客户选择（仅演示模式）：如 buyer1 / buyer2，限服务端白名单
  customer_id: qp('customer_id'),
  title: qp('title') || '智能客服',
  subtitle: qp('subtitle') || '',
  theme: qp('theme') || '#1890ff',
};

// 清除地址栏和浏览器历史中的旧版密钥参数；会话内只保留非机密的 app_key。
if (CONFIG.app_key && CONFIG.app_secret) {
  try {
    sessionStorage.setItem('cs_preview_app_key', CONFIG.app_key);
    var cleanURL = new URL(location.href);
    cleanURL.searchParams.delete('app_key');
    cleanURL.searchParams.delete('app_secret');
    history.replaceState(null, '', cleanURL.pathname + cleanURL.search + cleanURL.hash);
  } catch(e) {}
} else if (!CONFIG.token && !CONFIG.customer_key) {
  try { CONFIG.app_key = sessionStorage.getItem('cs_preview_app_key'); } catch(e) {}
}

// 清除旧版演示页曾保存的明文密码。新登录页只保存短期客户会话令牌。
try { localStorage.removeItem('cs_demo_creds'); } catch(e) {}
if (CONFIG.customer_secret || CONFIG.token) {
  try {
    var cleanURL2 = new URL(location.href);
    cleanURL2.searchParams.delete('customer_secret');
    cleanURL2.searchParams.delete('token');
    history.replaceState(null, '', cleanURL2.pathname + cleanURL2.search + cleanURL2.hash);
  } catch(e) {}
}

// 设置主题色
document.documentElement.style.setProperty('--theme', CONFIG.theme);
document.documentElement.style.setProperty('--theme-dark', darkenColor(CONFIG.theme));
document.getElementById('chatTitle').textContent = CONFIG.title;
if (CONFIG.subtitle) {
  document.getElementById('chatStatus').textContent = CONFIG.subtitle;
}

function darkenColor(hex){
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - 30); g = Math.max(0, g - 30); b = Math.max(0, b - 30);
  return '#' + [r,g,b].map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}

// ============ 会话管理 ============
// 身份全部来自服务端签发的客户会话（customer token）：
//   1) URL 传入 token（宿主签发）→ 直接用
//   2) localStorage 有本客户的会话 → 恢复（刷新页面不丢 thread_id 与聊天历史）
//   3) 都没有 → 用演示客户凭证调 /api/auth/customer-token 换取并持久化
// 前端不再自行生成或拼装身份；恢复的会话被服务端拒绝（过期/吊销）时
// 自动清掉旧会话并重新登录一次（新 thread_id），不会死循环。
var authToken = CONFIG.token;
var session = null; // {token, tenant_id, customer_id, thread_id, fromStorage}
var reloginTried = false; // 恢复会话被拒后只重登一次

function sessionStorageKey(){
	if (CONFIG.app_key) return 'cs_preview_session_' + CONFIG.server + '_' + CONFIG.app_key;
  if (!CONFIG.customer_id) return 'cs_guest_session_' + CONFIG.server;
  return 'cs_session_' + CONFIG.server + '_' + (CONFIG.customer_id || 'buyer1');
}

function openCustomerLogin(){
  var target = '/chat/login.html?return=pc';
  if (CONFIG.customer_id) target += '&customer_id=' + encodeURIComponent(CONFIG.customer_id);
  location.href = target;
}

function updateLoginButton(){
  var button = document.getElementById('customerLoginButton');
  if (button) button.style.display = session && session.is_guest ? 'inline-block' : 'none';
}

function sessionStore(){
  return CONFIG.app_key ? sessionStorage : localStorage;
}

function loadStoredSession(){
  try {
    var raw = sessionStore().getItem(sessionStorageKey());
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.token) return null;
    // URL 显式指定客户时，必须与存储会话一致（切换客户 → 走新登录）
    var want = CONFIG.customer_id;
    if (want) {
      var storedName = (s.customer_id || '').split(':').pop();
      if (s.customer_id !== want && storedName !== want) return null;
    }
    return s;
  } catch(e) { return null; }
}

function saveStoredSession(s){
  try {
    sessionStore().setItem(sessionStorageKey(), JSON.stringify({
      token: s.token, tenant_id: s.tenant_id,
      customer_id: s.customer_id, thread_id: s.thread_id, is_guest: !!s.is_guest
    }));
  } catch(e) {}
}

function clearStoredSession(){
  try { sessionStore().removeItem(sessionStorageKey()); } catch(e) {}
}

// 判定「这个响应能不能当业务响应来读」——决定 authFetch 要不要回退。
// 不能只看状态码：新层未部署时 nginx 会走 SPA 兜底，返回 200 HTML；
// 而新层存在但缺某个路由时，FastAPI 返回 404 {"detail":"Not Found"}。
// 所以按响应形态判：
//   · 5xx                              → 不可用（新层内部故障）
//   · 非 application/json（含兜底 HTML）→ 不可用（新层不存在）
//   · 404/405 且 body 无 code 字段      → 不可用（框架级 404，新层缺该路由）
//   · 带 code 的 4xx（401/403/404 等）  → 算可用，交给调用方处理，绝不回退
// 最后一条是边界：业务 404（订单不存在）、401（身份被拒）都是「新层正常工作」的结论，
// 一旦回退就会被旧入口再答一次，等于掩盖真实语义。
async function looksLikeBusinessResponse(response){
  if (response.status >= 500) return false;
  var type = (response.headers.get('content-type') || '').toLowerCase();
  if (type.indexOf('application/json') < 0) return false;
  if (response.status === 404 || response.status === 405){
    try {
      var body = await response.clone().json();
      return !!body && typeof body === 'object' && body.code !== undefined;
    } catch(e) { return false; }
  }
  return true;
}

// 阶段1：认证/业务请求先走 FastAPI 业务层，新层不可用时回退 Go 旧入口。
// 回退只发生在「新层没应答」的情况；新层给了业务结论就照用，不换来源。
async function authFetch(path, options){
  var bases = [CONFIG.authBase, ''];
  var failure = null;
  for (var i = 0; i < bases.length; i++){
    var isLegacy = (i === bases.length - 1);
    try {
      var response = await fetch(bases[i] + path, options);
      if (isLegacy) return response;
      if (await looksLikeBusinessResponse(response)) return response;
      failure = new Error('新层不可用 ' + path + ' status=' + response.status);
    } catch(e) { failure = e; }
  }
  throw failure || new Error('认证服务不可用');
}

// 恢复本地会话前先向服务端确认：过期/登出/会话已删则清掉，避免带着废令牌连 WS。
// 新层不可用（兜底 HTML / 5xx）视为临时故障，保留原会话 —— WS 握手时还会再校验一次。
async function validateCustomerSession(stored){
  try {
    var resp = await fetch(CONFIG.authBase + '/api/customer/session', {
      headers: {'Authorization': 'Bearer ' + stored.token},
      cache: 'no-store'
    });
    if (!(await looksLikeBusinessResponse(resp))) return stored;
    if (resp.status === 401) return null;
    if (!resp.ok) return stored;
    var body = await resp.json();
    if (body.code !== 0 || !body.data) return null;
    stored.tenant_id = body.data.tenant_id;
    stored.customer_id = body.data.customer_id;
    stored.thread_id = body.data.thread_id;
    stored.is_guest = !!body.data.is_guest;
    return stored;
  } catch(e) {
    return stored;
  }
}

async function ensureSession(){
  if (session) return session;
  if (authToken) {
    // 宿主直接签发 token 传入时，前端只有 token；thread_id 由服务端在
    // WS 首次 history 消息前不可见，身份以服务端会话为准，URL 不再传 user_id
    session = { token: authToken, tenant_id: null, customer_id: null, thread_id: null, fromStorage: false };
    return session;
  }
  // 刷新恢复：优先用 localStorage 里的原会话（token 未过期则历史原样找回）
  var stored = loadStoredSession();
  if (stored) {
    var checked = await validateCustomerSession(stored);
    if (checked) {
      authToken = checked.token;
      session = {
        token: checked.token, tenant_id: checked.tenant_id,
        customer_id: checked.customer_id, thread_id: checked.thread_id,
        fromStorage: true, is_guest: !!checked.is_guest
      };
      updateLoginButton();
      return session;
    }
    clearStoredSession();  // 服务端判定失效：过期/已登出/会话不存在
  }
  if (CONFIG.app_key && CONFIG.app_secret) {
    showConnStatus('正在建立商家预览会话...');
    var previewResp = await authFetch('/api/auth/merchant-preview-token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({app_key: CONFIG.app_key, app_secret: CONFIG.app_secret})
    });
    var previewData = await previewResp.json();
    if (previewData.code !== 0) throw new Error(previewData.msg || '商家预览登录失败');
    session = {
      token: previewData.data.token,
      tenant_id: previewData.data.tenant_id,
      customer_id: previewData.data.customer_id,
      thread_id: previewData.data.thread_id,
      fromStorage: false
    };
    authToken = session.token;
    saveStoredSession(session);
    updateLoginButton();
    hideConnStatus();
    return session;
  }
  if (CONFIG.customer_key && CONFIG.customer_secret) {
    showConnStatus('正在登录...');
    var resp = await authFetch('/api/auth/customer-token', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        app_key: CONFIG.customer_key,
        app_secret: CONFIG.customer_secret,
        customer_id: CONFIG.customer_id || 'buyer1'
      })
    });
    var data = await resp.json();
    if (data.code === 0) {
      authToken = data.data.token;
      session = {
        token: data.data.token,
        tenant_id: data.data.tenant_id,
        customer_id: data.data.customer_id,
        thread_id: data.data.thread_id, // 服务端生成，只表示一段对话
        fromStorage: false
      };
      saveStoredSession(session);
      updateLoginButton();
      hideConnStatus();
      return session;
    }
    throw new Error(data.msg || '登录失败');
  }
  if (CONFIG.customer_id) {
    openCustomerLogin();
    throw new Error('请先登录客户账号');
  }
  if (CONFIG.app_key) throw new Error('预览会话已过期，请重新打开商家测试链接');
  showConnStatus('正在连接访客客服...');
  var guestResp = await authFetch('/api/auth/guest-token', {method:'POST'});
  var guestData = await guestResp.json();
  if (guestData.code !== 0) throw new Error(guestData.msg || '访客客服暂不可用');
  session = {
    token: guestData.data.token, tenant_id: guestData.data.tenant_id,
    customer_id: guestData.data.customer_id, thread_id: guestData.data.thread_id,
    is_guest: true, fromStorage: false
  };
  authToken = session.token;
  saveStoredSession(session);
  updateLoginButton();
  hideConnStatus();
  return session;
}

// 兼容旧调用点：只需要 token 的场景
async function ensureToken(){
  var s = await ensureSession();
  return s.token;
}

async function switchConversation(s, path){
  var resp = await authFetch(path, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + s.token, 'Content-Type': 'application/json'}
  });
  var body = null;
  try { body = await resp.json(); } catch(e) {}
  if (!resp.ok || !body || body.code !== 0){
    showConnStatus((body && body.msg) || '会话切换失败');
    setTimeout(hideConnStatus, 2500);
    return false;
  }
  s.thread_id = body.data.thread_id;
  if (session) session.thread_id = body.data.thread_id;
  saveStoredSession(s);
  return true;
}

async function bootChat(){
  var s;
  try {
    s = await ensureSession();
  } catch(e) {
    showConnStatus(e.message || '登录失败');
    setTimeout(hideConnStatus, 2500);
    return;
  }
  applySidebarState();
  renderBrand(s);
  await ConvList.load();
  connectWS();
}

// 欢迎页的"继续上次对话"入口：只在 24 小时内有历史、且不是当前会话时出现。
// 侧栏已经能随时切换，这里只是让"续聊"在空聊天页也可发现，不自动切换会话。
function renderResume(list){
  var btn = document.getElementById('welcomeResume');
  if (!btn) return;
  var s = session;
  if (!s || s.is_guest) { btn.hidden = true; return; }
  var now = Date.now();
  var cand = null;
  for (var i = 0; i < (list || []).length; i++){
    var it = list[i];
    if (it.current || !it.last_active_at) continue;
    if (now - new Date(it.last_active_at).getTime() > 86400000) continue;
    cand = it; break;
  }
  if (!cand) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.textContent = '继续上次：' + (cand.title || cand.preview || '空会话') + ' →';
  btn.onclick = function(){
    switchTo('/api/customer/conversations/' + encodeURIComponent(cand.thread_id) + '/activate');
  };
}

// ============ 会话侧栏 ============
// 归属与过期判定全在服务端；这里只负责渲染、切换与两个管理动作。
// 打开历史只读 —— 切换只改 thread_id 再重连 WS，不触发任何 Agent 调用。
function renderBrand(s){
  document.getElementById('convBrandTitle').textContent = CONFIG.title || '智能客服';
  var sub = s.is_guest ? '访客会话' : ((s.customer_id || '').split(':').pop() || '已登录');
  document.getElementById('convBrandSub').textContent = sub;
}

function closeWS(){
  if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (!ws) return;
  // 先摘掉 onclose：否则会触发自动重连，导致两条连接同时存在、消息重复
  ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null;
  try { ws.close(); } catch(e) {}
  ws = null;
  wsConnected = false;
  wsOpened = false;
  stopHeartbeat();
}

function clearChatBody(){
  var body = document.getElementById('chatBody');
  if (!body) return;
  // 只清消息节点，保留欢迎语容器：整个 textContent='' 会把 #welcomeMsg 一起删掉，
  // 切到一个空会话后就没有欢迎语和"继续上次"入口了。
  body.querySelectorAll('.msg, .typing').forEach(function(c){ c.remove(); });
  var welcome = document.getElementById('welcomeMsg');
  if (welcome) welcome.style.display = 'block';
  streamingEl = null;
  clearPendingTimers();
  renderedAnswerIds = new Set();
}

function switchTo(path){
  switchConversation(session, path).then(function(ok){
    if (!ok) return;
    closeWS();
    clearChatBody();
    connectWS();
    ConvList.load();
  });
}

function setSidebarCollapsed(collapsed){
  var sidebar = document.getElementById('convSidebar');
  var expand = document.getElementById('convExpandBtn');
  var app = document.getElementById('chatApp');
  if (!sidebar) return;
  sidebar.classList.toggle('collapsed', collapsed);
  if (expand) expand.classList.toggle('show', collapsed);
  if (app) app.classList.toggle('sidebar-collapsed', collapsed);
  try { localStorage.setItem('cs_sidebar_collapsed', collapsed ? '1' : '0'); } catch(e) {}
}

function applySidebarState(){
  var collapsed = false;
  try { collapsed = localStorage.getItem('cs_sidebar_collapsed') === '1'; } catch(e) {}
  setSidebarCollapsed(collapsed);
}

function toggleSidebar(){
  var sidebar = document.getElementById('convSidebar');
  if (!sidebar) return;
  setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
}

(function bindSidebar(){
  ConvList.init({
    listEl: document.getElementById('convList'),
    footHintEl: document.getElementById('convFootHint'),
    getSession: function(){ return session; },
    request: authFetch,
    notify: function(msg){ showConnStatus(msg); setTimeout(hideConnStatus, 2500); },
    onSwitch: function(path){ switchTo(path); },
    onLoaded: renderResume
  });
  var newBtn = document.getElementById('convNewBtn');
  var collapseBtn = document.getElementById('convCollapseBtn');
  var expandBtn = document.getElementById('convExpandBtn');
  var search = document.getElementById('convSearchInput');
  if (newBtn) newBtn.addEventListener('click', function(){ ConvList.create(); });
  if (collapseBtn) collapseBtn.addEventListener('click', toggleSidebar);
  if (expandBtn) expandBtn.addEventListener('click', toggleSidebar);
  if (search) search.addEventListener('input', function(e){ ConvList.setKeyword(e.target.value); });
  document.addEventListener('click', function(){ ConvList.closeMenu(); });
})();

// ============ WebSocket 连接 ============
var ws = null;
var wsConnected = false;
var wsOpened = false; // 本次连接是否成功打开（用于识别"鉴权失败型关闭"）
var kickedFlag = false; // 被其他窗口顶掉后不再自动重连
var reconnectTimer = null;
var reconnectCount = 0;

function connectWS(){
  kickedFlag = false;
  wsOpened = false;
  ensureSession().then(function(s){
    // 身份以服务端会话为准：WS 只带 token（浏览器无法设 Header，token 走 query），
    // thread_id 由服务端从会话记录解析，不再传 user_id
    var wsUrl = CONFIG.server.replace(/^http/, 'ws') + '/ws/chat?token=' + encodeURIComponent(s.token);
    ws = new WebSocket(wsUrl);

    ws.onopen = function(){
      wsOpened = true;
      wsConnected = true;
      reconnectCount = 0;
      hideConnStatus();
      document.getElementById('chatStatus').textContent = '在线';
      // 心跳
      startHeartbeat();
      // P1-1：连接建立后上报已读
      markAsRead();
    };

    ws.onmessage = function(e){
      var data;
      try { data = JSON.parse(e.data); } catch(err) { return; }
      handleWSMessage(data);
      // P1-1：收到新消息后，如果页面可见，延迟上报已读
      if (data.type === 'chat_reply' || data.type === 'human_reply' || data.type === 'human_notice') {
        if (!document.hidden) {
          setTimeout(markAsRead, 1000);
        }
      }
    };

    ws.onclose = function(){
      wsConnected = false;
      stopHeartbeat();
      if (streamingEl || document.getElementById('typingIndicator')) {
        cancelStreaming(); hideTyping();
        showConnStatus('连接已断开；已受理的问题继续处理，重连后同步结果。');
      }
      document.getElementById('chatStatus').textContent = '连接断开，重连中...';
      if (kickedFlag) return; // 已在其他窗口建立连接，停止重连
      // 恢复的会话被服务端拒绝（token 过期/被吊销）：清掉旧会话重新登录一次
      if (!wsOpened && s.fromStorage && !reloginTried) {
        reloginTried = true;
        clearStoredSession();
        session = null;
        authToken = null;
        showConnStatus('会话已过期，正在重新登录...');
        connectWS();
        return;
      }
      scheduleReconnect();
    };

    ws.onerror = function(){
      ws.close();
    };
  }).catch(function(err){
    showConnStatus('登录失败: ' + err.message);
    addSystemMessage('连接失败：' + err.message);
  });
}

function scheduleReconnect(){
  if (reconnectTimer) return;
  reconnectCount++;
  var delay = Math.min(1000 * Math.pow(2, reconnectCount), 30000);
  showConnStatus('连接断开，' + (delay/1000) + '秒后重连...');
  reconnectTimer = setTimeout(function(){
    reconnectTimer = null;
    connectWS();
  }, delay);
}

// 心跳
var heartbeatTimer = null;
function startHeartbeat(){
  stopHeartbeat();
  heartbeatTimer = setInterval(function(){
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type:'ping'}));
    }
  }, 30000);
}
function stopHeartbeat(){
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

// P1-1：上报已读
function markAsRead(){
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type:'read'}));
  }
}

// 页面可见性变化时上报已读
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && ws && ws.readyState === WebSocket.OPEN) {
    markAsRead();
  }
});

// ============ 消息处理 ============
function handleWSMessage(data){
  switch(data.type){
    case 'history':
      renderHistory(data.messages || [], data.turns || []);
      resendUnacknowledged(data.turns || []);
      refreshTicketNotice();
      postToParent('cs_ready', {thread_id: data.thread_id || (session && session.thread_id), customer_id: session && session.customer_id, tenant_id: session && session.tenant_id});
      break;
    case 'chat_reply':
      hideTyping(); cancelStreaming();
      addAIMessage(data.msg);
      postToParent('cs_message', {role: 'ai', content: data.msg});
      break;
    // P2-1：流式输出
    case 'chat_chunk':
      receiveChatChunk(data);
      break;
    case 'chat_end':
      if (data.answer_id) latestAnswerId = data.answer_id;
      removeTurnStatus(data.turn_id);
      clearUnacknowledged(data.turn_id);
      if (data.turn_id) terminatedTurns.add(data.turn_id);
      if (!data.turn_id || !renderedAnswerIds.has(data.turn_id)) {
        endStreaming(data.msg);
        if (data.turn_id) renderedAnswerIds.add(data.turn_id);
      }
      // 上报已读
      if (!document.hidden) {
        setTimeout(markAsRead, 1000);
      }
      break;
    case 'ticket': {
      removeTurnStatus(data.turn_id); hideTyping(); cancelStreaming();
      if (data.turn_id) terminatedTurns.add(data.turn_id);
      if (data.answer) {
        addAIMessage(data.answer);
        if (data.turn_id) renderedAnswerIds.add(data.turn_id);
      }
      // 答复与工单分两条渲染：回答气泡在前，工单号单独一条系统提示。
      // 原来有回答时直接 break，客户读到的是一段解答末尾追着"已提交人工客服，工单号：TK-xxx"。
      // [ours] 透出转人工原因：此前只提示“已建单”，用户不知道为什么会转人工
      var why = data.reason ? '（原因：' + data.reason + '）' : '';
      if (data.reused) {
        addSystemMessage('🎫 您已提交人工客服，正在等待人工接入（工单号：' + (data.ticket_no||'') + '）' + why);
      } else {
        addSystemMessage('🎫 已为您创建工单（' + (data.ticket_no||'') + '），请等待客服接管' + why);
      }
      postToParent('cs_handoff', {ticket_no: data.ticket_no, msg: data.msg, reason: data.reason || '', reused: !!data.reused});
      break;
    }
    case 'human_notice':
      removeTurnStatus(data.turn_id); hideTyping(); cancelStreaming();
      addSystemMessage('👤 ' + (data.msg || '人工客服已接入'));
      postToParent('cs_human', {msg: data.msg});
      break;
    case 'human_reply':
      hideTyping(); cancelStreaming();
      if (data.msg_type === 'image') addImageMessage(data.msg, true); else if (data.msg_type === 'video') addVideoMessage(data.msg, true);
      else addAIMessage(data.msg, true);
      postToParent('cs_message', {role: 'human', content: data.msg, msg_type: data.msg_type || 'text'});
      break;
    case 'notice':
      removeTurnStatus(data.turn_id); hideTyping(); cancelStreaming();
      addSystemMessage(data.msg);
      postToParent('cs_notice', {msg: data.msg});
      break;
    case 'error':
      hideTyping(); cancelStreaming();
      addSystemMessage('⚠️ ' + (data.msg || '出错了'));
      if (data.code === 'concurrency_full') {
        // 租户并发已满：停止心跳，30s 后自动重试（旧连接释放后自愈）
        wsConnected = false;
        stopHeartbeat();
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        reconnectTimer = setTimeout(function(){ reconnectTimer=null; connectWS(); }, 30000);
        document.getElementById('chatStatus').textContent = data.msg || '并发会话数已达上限';
      }
      postToParent('cs_error', {msg: data.msg, code: data.code});
      break;
    case 'turn_update':
      clearUnacknowledged(data.turn_id);
      upsertTurnStatus(data);
      break;
    case 'pong':
      break;
    case 'kicked':
      // 已在其他窗口建立连接：停止自动重连，避免无限互踢
      kickedFlag = true;
      wsConnected = false;
      stopHeartbeat();
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      document.getElementById('chatStatus').textContent = data.msg || '连接已在其他窗口建立';
      addSystemMessage('ℹ️ ' + (data.msg || '连接已在其他窗口建立'));
      break;
  }
}

function renderHistory(messages, turns){
  messages = messages || [];
  turns = turns || [];
  // 清空现有消息（保留欢迎语元素）
  var body = document.getElementById('chatBody');
  Object.keys(turnStatusTimers).forEach(removeTurnStatus);
  var children = body.querySelectorAll('.msg, .typing');
  children.forEach(function(c){ c.remove(); });
  streamingEl = null; streamingTurnId = ''; streamingLastSeq = -1; clearPendingTimers();
  renderedAnswerIds = new Set();
  terminatedTurns = new Set();
  var byUserId = {};
  turns.forEach(function(t){ byUserId[String(t.user_message_id)] = t; });
  // 渲染历史
  messages.forEach(function(m){
    var role = m.role || m.sender || 'ai';
    var content = m.content || m.msg || m.message || '';
    if (m.msg_type === 'video') { addVideoMessage(content, (role === 'user' || role === 'customer') ? false : true, m.created_at || m.timestamp, true); } else if (m.msg_type === 'image') {
      addImageMessage(content, (role === 'user' || role === 'customer') ? false : true, m.created_at || m.timestamp, true);
    } else if (role === 'user' || role === 'customer') {
      addUserMessage(content, m.created_at || m.timestamp, true);
      if (byUserId[String(m.id)]) upsertTurnStatus(byUserId[String(m.id)]);
    } else if (role === 'system' || role === 'notice') {
      addSystemMessage(content, true);
    } else {
      addAIMessage(content, false, m.created_at || m.timestamp, true);
      if (m.answer_id) renderedAnswerIds.add(m.answer_id);
    }
  });
  // 空会话（刚登录或新建）没有历史，欢迎语与"继续上次"入口应当保留；
  // 只有真的渲染出消息时才隐藏，否则切换到一个空会话会得到一张白板。
  var welcome = document.getElementById('welcomeMsg');
  if (welcome) welcome.style.display = messages.length ? 'none' : 'block';
  scrollToBottom();
}

// 每条消息使用稳定请求 ID。未收到受理回执时，重连仍发送同一个 ID。
var renderedAnswerIds = new Set();
// 已经给出终态的轮次：多 Worker 重试时，迟到的 running 事件不能把「处理中」画回来
var terminatedTurns = new Set();
function newTurnId(){
  if (crypto.randomUUID) return crypto.randomUUID();
  var bytes = crypto.getRandomValues(new Uint8Array(16));
  bytes[6] = (bytes[6] & 15) | 64; bytes[8] = (bytes[8] & 63) | 128;
  var h = Array.from(bytes, function(x){ return x.toString(16).padStart(2,'0'); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function pendingTurnKey(){ return 'cs_pending_turns_' + (session && session.thread_id || ''); }
function pendingTurns(){ try { return JSON.parse(localStorage.getItem(pendingTurnKey()) || '{}'); } catch(e){ return {}; } }
function savePendingTurns(items){ try { localStorage.setItem(pendingTurnKey(), JSON.stringify(items)); } catch(e){} }
function rememberUnacknowledged(id, msg, msgType){ var items=pendingTurns(); items[id]={msg:msg,msg_type:msgType||'text'}; savePendingTurns(items); }
function clearUnacknowledged(id){ if(!id)return; var items=pendingTurns(); if(items[id]){delete items[id];savePendingTurns(items);} }
function resendUnacknowledged(turns){
  if(!ws || ws.readyState!==WebSocket.OPEN)return;
  var accepted=new Set((turns||[]).map(function(t){return t.turn_id;}));
  var items=pendingTurns();
  Object.keys(items).forEach(function(id){
    if(accepted.has(id)){clearUnacknowledged(id);return;}
    var item=items[id];
    if(!document.getElementById('turn-status-'+id)){
      addUserMessage(item.msg); upsertTurnStatus({turn_id:id,status:'queued'});
    }
    ws.send(JSON.stringify({type:'chat',request_id:id,msg:item.msg,msg_type:item.msg_type}));
  });
}
var turnStatusTimers={};
var turnStatusStarted={};
function removeTurnStatus(id,preserveStart){
  if(turnStatusTimers[id]){clearInterval(turnStatusTimers[id]);delete turnStatusTimers[id];}
  if(!preserveStart)delete turnStatusStarted[id];
  var el=id&&document.getElementById('turn-status-'+id); if(el)el.remove();
}
function upsertTurnStatus(turn){
  if(!turn || !turn.turn_id)return;
  if(terminatedTurns.has(turn.turn_id))return;   // 终态已出，迟到的事件不再渲染
  removeTurnStatus(turn.turn_id,true);
  if(turn.status==='completed'){delete turnStatusStarted[turn.turn_id];return;}
  var div=document.createElement('div'); div.className='msg ai turn-status'; div.id='turn-status-'+turn.turn_id;
  div.innerHTML=avatarHTML('ai')+'<div></div>';
  var bubble=document.createElement('div'); bubble.className='bubble';
  var phases={searching:'正在查找相关信息',checking:'正在整理查询结果',reviewing:'正在核对答复',finalizing:'正在准备回复'};
  var label=turn.status==='failed'?'处理失败，可重试':(turn.status==='running'?(phases[turn.phase]||'正在处理您的问题'):'已受理，等待处理');
  if(turn.status==='running'){
    if(!turnStatusStarted[turn.turn_id])turnStatusStarted[turn.turn_id]=Date.now();
    var started=turnStatusStarted[turn.turn_id];
    var updateElapsed=function(){var seconds=Math.floor((Date.now()-started)/1000);bubble.firstChild.textContent=label+'…'+(seconds>=5?' 已等待 '+seconds+' 秒':'');};
    bubble.appendChild(document.createTextNode(''));updateElapsed();
    turnStatusTimers[turn.turn_id]=setInterval(updateElapsed,1000);
  }else{delete turnStatusStarted[turn.turn_id];bubble.textContent=label+'…';}
  if(turn.status==='failed'){
    var button=document.createElement('button'); button.type='button'; button.textContent='重试';
    button.style.marginLeft='8px'; button.onclick=function(){retryTurn(turn.turn_id);};
    bubble.appendChild(button);
  }
  div.lastElementChild.appendChild(bubble); document.getElementById('chatBody').appendChild(div); scrollToBottom();
}
function retryTurn(id){
  if(!ws || ws.readyState!==WebSocket.OPEN){addSystemMessage('请等待连接恢复后重试');return;}
  ws.send(JSON.stringify({type:'retry',turn_id:id}));
  upsertTurnStatus({turn_id:id,status:'queued'});
}

// ============ UI 操作 ============
// 消息头像：AI 用品牌气泡图标，人工客服用人形底色块；用户消息不带头像
// （与 addUserMessage 一致，避免"文字消息没头像、图片消息有"的割裂）。
function avatarHTML(kind){

function addUserMessage(text, time, noScroll){

// 阶段2：刷新后回显进行中的工单（工单只在建单那一刻经 WS 提示过，刷新即丢失）
var ticketNoticeDone = false;
async function refreshTicketNotice(){
  if (ticketNoticeDone) return;
  ticketNoticeDone = true;
  try {
    var token = await ensureToken();
    var resp = await authFetch('/api/customer/ticket', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    if (!resp || resp.status !== 200) return;
    var data = await resp.json();
    var t = data && data.data;
    if (!t || t.status_text === 'closed' || t.status_text === 'cancelled') return;
    addSystemMessage('🎫 您有一张进行中的工单（' + t.ticket_no + '），当前状态：' +
      (t.status_text === 'handling' ? '客服已接管' : '等待客服接入'));
  } catch(e) { /* 工单状态回显失败不影响聊天 */ }
}

function showTyping(){

  var body = document.getElementById('chatBody');

function hideTyping(){

// P2-1：流式输出相关
var streamingEl = null;  // 当前正在流式输出的消息元素
var streamingText = '';  // 已接收的流式文本
var streamingTurnId = '';
var streamingLastSeq = -1;
var pendingTimers = [];

function receiveChatChunk(data){
  if (data.turn_id && renderedAnswerIds.has(data.turn_id)) return;
  if (data.turn_id && streamingTurnId && streamingTurnId !== data.turn_id) cancelStreaming();
  if (data.turn_id) {
    if (streamingTurnId === data.turn_id && Number.isInteger(data.seq) && data.seq <= streamingLastSeq) return;
    streamingTurnId = data.turn_id;
    if (Number.isInteger(data.seq)) streamingLastSeq = data.seq;
    removeTurnStatus(data.turn_id);
  }
  appendStreamChunk(data.chunk || '');
}

function clearPendingTimers(){
  pendingTimers.forEach(clearTimeout);
  pendingTimers = [];
}

function setPendingText(text){
  if (!streamingEl || streamingText) return;
  var bubble = streamingEl.querySelector('.bubble');
  if (bubble) bubble.textContent = text;
}

function startStreaming(){
  // 首个回答片段可能要等较久；先给出可见的等待反馈。
  clearPendingTimers();
  hideTyping();
  var body = document.getElementById('chatBody');
  var div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'streamingMsg';
  div.innerHTML = avatarHTML('ai')+'<div><div class="bubble" role="status" aria-live="polite"></div><div class="time"></div></div>';
  div.querySelector('.time').textContent = formatTime();
  body.appendChild(div);
  streamingEl = div;
  streamingText = '';
  setPendingText('正在处理您的问题…');
  pendingTimers.push(setTimeout(function(){ setPendingText('仍在处理，请稍候…'); }, 8000));
  pendingTimers.push(setTimeout(function(){ setPendingText('问题较复杂，正在继续处理…'); }, 25000));
  scrollToBottom();
}

// 流式节流：每个 chunk 都全量重建 DOM 是 O(n²)，60ms 合并一次足够跟手
var mdRenderTimer = null;
function scheduleStreamRender(){
  if (mdRenderTimer) return;
  mdRenderTimer = setTimeout(function(){
    mdRenderTimer = null;
    if (!streamingEl) return;
    renderMarkdown(streamingEl.querySelector('.bubble'), streamingText);
    scrollToBottom();
  }, 60);
}

function appendStreamChunk(chunk){
  if (!chunk) return;
  if (!streamingEl) {
    startStreaming();
  }
  if (chunk) clearPendingTimers();
  streamingText += chunk;
  scheduleStreamRender();
}

function endStreaming(fullText){
  clearPendingTimers();
  if (streamingEl) {
    if (mdRenderTimer) { clearTimeout(mdRenderTimer); mdRenderTimer = null; }
    if (fullText) {
      streamingText = fullText;
      renderMarkdown(streamingEl.querySelector('.bubble'), fullText);
    }
    if (!streamingText) {
      streamingEl.remove();
      streamingEl = null;
      addSystemMessage('暂时没有收到回复，请重试。');
      return;
    }
    streamingEl.id = '';
    streamingEl = null;
    scrollToBottom();
  } else if (fullText) {
    // 快答/缓存链路可能一个 chat_chunk 都不发，只给整段 chat_end：
    // 没有流式元素时必须直接落一条完整消息，否则气泡永远空白。
    streamingText = fullText;
    hideTyping();
    addAIMessage(fullText);
  }
  postToParent('cs_message', {role: 'ai', content: streamingText});
  streamingTurnId = ''; streamingLastSeq = -1;
}

function cancelStreaming(){
  // 取消流式输出（不 postToParent）
  clearPendingTimers();
  streamingTurnId = ''; streamingLastSeq = -1;
  if (streamingEl) {
    streamingEl.remove();
    streamingEl = null;
    streamingText = '';
  }
}

function formatTime(time){
  if (!time) {
    var d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  if (typeof time === 'number') time = new Date(time);
  if (time instanceof Date) {
    return time.getHours().toString().padStart(2,'0') + ':' + time.getMinutes().toString().padStart(2,'0');
  }
  // 字符串时间
  var s = String(time);
  var m = s.match(/(\d{2}):(\d{2})/);
  return m ? m[1] + ':' + m[2] : s.slice(0,16);
}

function scrollToBottom(){
  var body = document.getElementById('chatBody');
  setTimeout(function(){ body.scrollTop = body.scrollHeight; }, 10);
}

function showConnStatus(msg){
  var el = document.getElementById('connStatus');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideConnStatus(){
  document.getElementById('connStatus').style.display = 'none';
}

// ============ 发送消息 ============
// ============ 满意度评价 ============
var ratingScore = 0;
var ratingTags = [];
var latestAnswerId = '';  // [ours] S1：最近一轮 AI 回答的归因锚点（chat_end/HTTP 应答携带）

function openRating(){
  ratingScore = 0;
  ratingTags = [];
  document.querySelectorAll('#ratingStars .star').forEach(function(s){ s.classList.remove('on'); });
  document.querySelectorAll('.rating-tags .tag').forEach(function(t){ t.classList.remove('on'); });
  document.getElementById('ratingComment').value = '';
  document.getElementById('ratingSubmit').disabled = false;
  document.getElementById('ratingMask').style.display = 'flex';
}
function closeRating(){
  document.getElementById('ratingMask').style.display = 'none';
}
function pickStar(v){
  ratingScore = v;
  document.querySelectorAll('#ratingStars .star').forEach(function(s){
    s.classList.toggle('on', parseInt(s.dataset.v,10) <= v);
  });
}
function toggleTag(btn){
  btn.classList.toggle('on');
  var v = btn.dataset.v;
  var i = ratingTags.indexOf(v);
  if (i >= 0) ratingTags.splice(i,1); else ratingTags.push(v);
}
async function submitRating(){
  var btn = document.getElementById('ratingSubmit');
  if (!ratingScore) { alert('请先选择星级'); return; }
  btn.disabled = true;
  try {
    var token = await ensureToken();
    // 阶段2：评价改由 FastAPI 业务层处理；不可用时 authFetch 回退旧入口
    var resp = await authFetch('/api/customer/rating', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({
        score: ratingScore,
        tags: ratingTags.join(','),
        comment: document.getElementById('ratingComment').value.trim(),
        answer_id: latestAnswerId || ''  // [ours] S1 轮次归因锚点
      })
    });
    var data = await resp.json();
    if (data.code === 0) {
      closeRating();
      addSystemMessage('感谢您的评价！');
    } else {
      alert(data.msg || '提交失败，请重试');
      btn.disabled = false;
    }
  } catch(e) {
    alert('提交失败：' + (e.message || e));
    btn.disabled = false;
  }
}

function sendMessage(){
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  if (session && session.is_guest && /\b(?:ORD[-\w]+|TB\d+|JD\d+|PDD\d+|DY\d+|TMALL\d+|1688\d+)\b/i.test(text)) {
    addSystemMessage('查询个人订单需要登录。常见问题仍可免登录咨询；点击右上角“登录查订单”继续。');
    return;
  }
  if (!wsConnected) {
    addSystemMessage('连接未建立，请稍候...');
    return;
  }

  addUserMessage(text);
  input.value = '';
  autoResize(input);
  var requestId = newTurnId();
  rememberUnacknowledged(requestId, text, 'text');
  upsertTurnStatus({turn_id:requestId, status:'queued'});
  try {
    ws.send(JSON.stringify({type:'chat', request_id:requestId, msg:text}));
  } catch(e) {
    addSystemMessage('发送暂未确认，重连后会用同一请求 ID 重试。');
  }
}

// 图片/视频消息上传：校验 → 上传 → 本地显示 → WS 发送 msg_type=image/video
async function uploadMedia(input, kind, file){
  if (input) { file = input.files && input.files[0]; input.value = ''; }
  if (!file) return;
  if (kind === 'image') {
    if (!/\.(jpe?g|png|gif|webp)$/i.test(file.name || '')) { addSystemMessage('仅支持 jpg/png/gif/webp 图片'); return; }
    if (file.size > 5*1024*1024) { addSystemMessage('图片不能超过 5MB'); return; }
  } else {
    if (!/\.(mp4|webm)$/i.test(file.name || '')) { addSystemMessage('仅支持 mp4/webm 视频'); return; }
    if (file.size > 50*1024*1024) { addSystemMessage('视频不能超过 50MB'); return; }
  }
  if (!wsConnected) { addSystemMessage('连接未建立，请稍候...'); return; }
  var fd = new FormData();
  fd.append('file', file);
  // 上传接口身份来自 Bearer token（服务端会话），不再传 user_id query
  var upUrl = CONFIG.server + '/api/user/upload';
  try {
    var token = authToken || await ensureToken();
    var resp = await fetch(upUrl, { method:'POST', headers:{'Authorization':'Bearer ' + token}, body: fd });
    var data = await resp.json();
    if (data.code !== 0) { addSystemMessage('上传失败：' + (data.msg || '')); return; }
    var url = data.data.url;
    if (kind === 'image') addImageMessage(url, false); else addVideoMessage(url, false);
    var requestId=newTurnId(); rememberUnacknowledged(requestId,url,kind);
    upsertTurnStatus({turn_id:requestId,status:'queued'});
    ws.send(JSON.stringify({type:'chat',request_id:requestId,msg:url,msg_type:kind}));
  } catch(e) { addSystemMessage('上传失败：' + e.message); }
}

// 按 MIME 优先、扩展名兜底判定文件类型（拖拽文件的 type 常为空字符串，必须按扩展名兜底）
function kindOf(f){
  var t = (f.type || '').toLowerCase();
  if (/^image\//.test(t) || /\.(jpe?g|png|gif|webp)$/i.test(f.name || '')) return 'image';
  if (/^video\//.test(t) || /\.(mp4|webm)$/i.test(f.name || '')) return 'video';
  return '';
}

// ============ 拖拽上传 ============
function onDragOver(e){
  e.preventDefault();
  var tip = document.getElementById('dropTip');
  if (tip && !tip.classList.contains('show')) tip.classList.add('show');
}
function onDragLeave(e){
  var tip = document.getElementById('dropTip');
  var ct = document.getElementById('chatInput');
  if (tip && ct && !ct.contains(e.relatedTarget)) tip.classList.remove('show');
}
function onDrop(e){
  e.preventDefault();
  var tip = document.getElementById('dropTip');
  if (tip) tip.classList.remove('show');
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  var kind = kindOf(f);
  if (!kind) { addSystemMessage('仅支持图片(jpg/png/gif/webp)或视频(mp4/webm)'); return; }
  uploadMedia(null, kind, f);
}

function requestHandoff(){
  if (!wsConnected) {
    addSystemMessage('连接未建立，请稍候...');
    return;
  }
  addUserMessage('请转接人工客服');
  showTyping();
  try {
    var requestId=newTurnId(); rememberUnacknowledged(requestId,'请转接人工客服','text');
    upsertTurnStatus({turn_id:requestId,status:'queued'});
    ws.send(JSON.stringify({type:'chat',request_id:requestId,msg:'请转接人工客服'}));
  } catch(e) {
    hideTyping();
    addSystemMessage('发送失败：' + e.message);
  }
}

// ============ 输入框处理 ============
function handleKey(e){
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ============ 其他操作 ============
function clearChat(){
  if (!confirm('确定清空当前对话记录吗？')) return;
  var body = document.getElementById('chatBody');
  var children = body.querySelectorAll('.msg, .typing');
  children.forEach(function(c){ c.remove(); });
  var welcome = document.getElementById('welcomeMsg');
  if (welcome) welcome.style.display = 'block';
}

function closeWindow(){
  // 尝试关闭窗口（iframe 中由父窗口处理）
  if (window.parent && window.parent !== window) {
    // 通知父窗口关闭
    window.parent.postMessage({type:'cs_close'}, '*');
  }
  // WebView 中尝试关闭
  try { window.close(); } catch(e) {}
}

// ============ 初始化 ============
var sdkAuthStarted = false;
if (qp('sdk_auth') === '1') {
  showConnStatus('等待客户身份...');
  postToParent('cs_need_auth');
} else {
  // 先登录，再看有没有可恢复的历史会话，最后才连 WS（WS 握手会用最终的 thread_id）
  bootChat();
}

// ============ postMessage 通信（SDK iframe 集成） ============
function postToParent(type, data){
  if (window.parent && window.parent !== window) {
    try { window.parent.postMessage(Object.assign({type: type, source: 'cs-chat'}, data || {}), '*'); } catch(e){}
  }
}

// 监听父窗口（SDK）消息
window.addEventListener('message', function(e){
  if (e.source !== window.parent) return;
  if (!e.data || typeof e.data !== 'object') return;
  switch(e.data.type){
    case 'cs_auth':
      if (!sdkAuthStarted && typeof e.data.token === 'string' && e.data.token) {
        sdkAuthStarted = true;
        authToken = e.data.token;
        CONFIG.token = e.data.token;
        connectWS();
      }
      break;
    case 'cs_send':
      // 外部主动发送消息
      var text = e.data.text || '';
      if (text) {
        document.getElementById('msgInput').value = text;
        sendMessage();
      }
      break;
    case 'cs_close':
      // 外部要求关闭（SDK 弹窗关闭时通知）
      break;
    case 'cs_clear':
      // 外部要求清空对话
      var body = document.getElementById('chatBody');
      body.querySelectorAll('.msg, .typing').forEach(function(c){ c.remove(); });
      var w = document.getElementById('welcomeMsg');
      if (w) w.style.display = 'block';
      break;
    case 'cs_config':
      // 外部更新配置
      if (e.data.title) document.getElementById('chatTitle').textContent = e.data.title;
      if (e.data.theme) {
        document.documentElement.style.setProperty('--theme', e.data.theme);
        document.documentElement.style.setProperty('--theme-dark', darkenColor(e.data.theme));
      }
      break;
  }
});
</script>
